spring.application.name=backend
server.port=8081
corsino.jwt.secret=${CORSINO_JWT_SECRET:}

# PostgreSQL. The password has no default: BancoConfig refuses to start without it.
spring.datasource.url=${CORSINO_DB_URL:jdbc:postgresql://localhost:5433/corsinotones}
spring.datasource.username=${CORSINO_DB_USER:corsino}
spring.datasource.password=${CORSINO_DB_PASSWORD:}
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
