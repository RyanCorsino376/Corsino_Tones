<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Packs de presets de pedais e pedaleiras de guitarra por estilo musical, com busca e filtros por equipamento e estilo.">
    <link rel="stylesheet" href="style.css">
    <title>Packs | CorsinoTones</title>
</head>
<body>
    <header class="cabecalho">
        <a href="index.html"><img src="../imagens/LogoSite.svg" alt="CorsinoTones" class="icone"></a>
    </header>
    <nav class="navegacao">
        <div class="nav-links">
            <a href="index.html" class="nav-txt">Página Inicial</a>
            <a href="packs.html" class="nav-txt" aria-current="page">Packs</a>
            <a href="biblioteca.html" class="nav-txt">Biblioteca</a>
        </div>
        <!-- Right-hand group: positioned as one block at every breakpoint. -->
        <div class="acoes-cabecalho">
            <!-- Cart icon: Lucide "shopping-cart" (ISC license), same style as the user icon. -->
            <a href="carrinho.html" class="carrinho">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                </svg>
                <span class="carrinho-texto">Carrinho (0)</span>
            </a>
            <a href="login.html" class="entrar">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="7" r="4"/>
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                </svg>
                <span>Entrar</span>
            </a>
        </div>
    </nav>
    <div class="layout">
        <aside class="filtros" aria-labelledby="titulo-filtros">
            <div class="filtros-fixos">
                <h2 id="titulo-filtros">Filtros</h2>
                <form id="form-filtros">
                    <fieldset>
                        <legend>Marcas</legend>
                        <ul>
                            <li>
                                <input type="checkbox" id="marca-boss" name="marca" value="boss">
                                <label for="marca-boss">Boss</label>
                            </li>
                            <li>
                                <input type="checkbox" id="marca-line6" name="marca" value="line6">
                                <label for="marca-line6">Line 6</label>
                            </li>
                            <li>
                                <input type="checkbox" id="marca-nux" name="marca" value="nux">
                                <label for="marca-nux">NUX</label>
                            </li>
                            <li>
                                <input type="checkbox" id="marca-zoom" name="marca" value="zoom">
                                <label for="marca-zoom">Zoom</label>
                            </li>
                        </ul>
                    </fieldset>
                    <fieldset>
                        <legend>Estilos</legend>
                        <ul>
                            <li>
                                <input type="checkbox" id="estilo-rock" name="estilo" value="rock">
                                <label for="estilo-rock">Rock</label>
                            </li>
                            <li>
                                <input type="checkbox" id="estilo-blues" name="estilo" value="blues">
                                <label for="estilo-blues">Blues</label>
                            </li>
                            <li>
                                <input type="checkbox" id="estilo-metal" name="estilo" value="metal">
                                <label for="estilo-metal">Metal</label>
                            </li>
                            <li>
                                <input type="checkbox" id="estilo-clean" name="estilo" value="clean">
                                <label for="estilo-clean">Clean</label>
                            </li>
                        </ul>
                    </fieldset>
                    <div class="filtro-acoes">
                        <button type="reset">Limpar Filtros</button>
                    </div>
                </form>
            </div>
        </aside>
        <main class="conteudo">
            <h1>Packs</h1>
            <!-- form="form-filtros" ties these controls to the sidebar form, so
                 "Limpar" resets them too and Enter never reloads the page. -->
            <div class="barra-lista">
                <div class="campo-busca">
                    <label for="busca">Buscar</label>
                    <input type="search" id="busca" name="busca" form="form-filtros"
                        placeholder="Pack, preset, equipamento ou descrição" autocomplete="off">
                </div>
                <div class="campo-ordem">
                    <label for="ordem">Ordenar por</label>
                    <!-- "selected" is what reset restores, so it marks the default order. -->
                    <select id="ordem" name="ordem" form="form-filtros">
                        <option value="recentes" selected>Mais recentes</option>
                        <option value="antigos">Mais antigos</option>
                        <option value="nome">Nome (A-Z)</option>
                    </select>
                </div>
            </div>
            <p id="contagem" class="contagem-resultados" role="status" aria-live="polite"></p>
            <!-- Loading and error messages; empty once the catalogue is on screen. -->
            <div class="estado-carga"></div>
            <!-- Pack cards are built by paginas/packs.js from the API catalogue. -->
            <section class="grade-presets"></section>
            <div class="lista-vazia" hidden>
                <p>Nenhum pack encontrado</p>
                <p>Tente outra busca ou clique em "Limpar" para remover os filtros.</p>
            </div>
            <noscript>
                <p class="aviso-sem-js">A lista de packs requer JavaScript. Ative-o no navegador para ver os packs.</p>
            </noscript>
        </main>
    </div>
    <footer class="rodape">Copyright 2026 ®</footer>
    <script type="module" src="paginas/packs.js"></script>
</body>
</html>
