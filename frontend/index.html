<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Packs de presets de pedais e pedaleiras de guitarra por estilo, desenvolvidos por Ryan Corsino.">
    <link rel="stylesheet" href="style.css">
    <title>CorsinoTones</title>
</head>
<body>
    <header class="cabecalho">
        <a href="index.html"><img src="../imagens/Logo%20Site.svg" alt="CorsinoTones" class="icone"></a>
    </header>
    <nav class="navegacao">
        <div class="nav-links">
            <a href="index.html" class="nav-txt" aria-current="page">Página Inicial</a>
            <a href="packs.html" class="nav-txt">Packs</a>
            <a href="biblioteca.html" class="nav-txt">Biblioteca</a>
        </div>
        <!-- Right-hand group: positioned as one block at every breakpoint. -->
        <div class="acoes-cabecalho">
            <!-- Cart icon: Lucide "shopping-cart" (ISC license), same style as the user icon. -->
            <a href="carrinho.html" class="carrinho">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                </svg>
                <span class="carrinho-texto">Carrinho (0)</span>
            </a>
            <a href="login.html" class="entrar">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="7" r="4"/>
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                </svg>
                <span>Entrar</span>
            </a>
        </div>
    </nav>
    <main>
        <section class="welcome">
            <!-- Decorative full-bleed background; the animation lives in style.css. -->
            <img src="../imagens/ImagemAdm.jpeg" alt="" class="fotoAdm">
            <div class="frasePrincipal">
                <p class="boasVindas">Seja bem-vindo à CorsinoTones</p>
                <h2>Presets desenvolvidos diretamente por mim!!</h2>
                <span>Compre uma vez e baixe quando quiser na sua biblioteca</span>
            </div>
        </section>
        <div class="tituloCarrossel">
            <h2>Packs</h2>
        </div>
        <!-- Loading and error messages; empty once the carousel is filled. -->
        <div class="estado-carga"></div>
        <!-- Pack cards are built by paginas/inicio.js from the API catalogue. -->
        <section class="carrossel"></section>
    </main>
    <footer class="rodape">Copyright 2026 ®</footer>
    <script type="module" src="paginas/inicio.js"></script>
</body>
</html>
