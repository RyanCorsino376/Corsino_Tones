<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta do CorsinoTones para favoritar e comentar presets.">
    <link rel="stylesheet" href="style.css">
    <title>Entrar | CorsinoTones</title>
</head>
<body>
    <header class="cabecalho">
        <a href="index.html"><img src="../imagens/Logo%20Site.svg" alt="CorsinoTones" class="icone"></a>
    </header>
    <nav class="navegacao">
        <div class="nav-links">
            <a href="index.html" class="nav-txt">Página Inicial</a>
            <a href="packs.html" class="nav-txt">Packs</a>
            <a href="biblioteca.html" class="nav-txt">Biblioteca</a>
        </div>
        <!-- Right-hand group: positioned as one block at every breakpoint. -->
        <div class="acoes-cabecalho">
            <!-- Cart icon: Lucide "shopping-cart" (ISC license), same style as the user icon. -->
            <a href="carrinho.html" class="carrinho">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                </svg>
                <span class="carrinho-texto">Carrinho (0)</span>
            </a>
        </div>
    </nav>
    <main class="loginForm">
        <!-- data-vista names the presented face. Without the script it stays
             "login" and both faces simply stack. -->
        <div class="cartao-login" data-vista="login">
            <section class="login face face-login" aria-label="Entrar">
                <h1>Entrar</h1>
                <!-- action stays empty: paginas/login.js sends the form to the API -->
                <!-- novalidate: login.js writes the messages; required/type still feed
                     validity and keep the browser checks when the script is off. -->
                <form action="" method="post" class="loginCampos" id="form-login" novalidate>
                    <fieldset>
                        <label for="email">Seu Email</label>
                        <input type="email" id="email" name="email"
                            autocomplete="email" required>
                    </fieldset>
                    <fieldset>
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha"
                            autocomplete="current-password" required>
                    </fieldset>
                    <button type="submit" class="loginBt">Login</button>
                    <button type="button" class="loginBt" data-alvo="cadastro">Não tenho conta</button>
                </form>
                <a href="#" class="loginLink">Esqueci a senha</a>
            </section>

            <section class="login face face-cadastro" aria-label="Criar conta">
                <h1>Criar conta</h1>
                <form action="" method="post" class="loginCampos" id="form-cadastro" novalidate>
                    <fieldset>
                        <label for="cadastro-nome">Seu nome</label>
                        <input type="text" id="cadastro-nome" name="nome"
                            autocomplete="name" required>
                    </fieldset>
                    <fieldset>
                        <label for="cadastro-email">Seu Email</label>
                        <input type="email" id="cadastro-email" name="email"
                            autocomplete="email" required>
                    </fieldset>
                    <fieldset>
                        <label for="cadastro-senha">Senha</label>
                        <input type="password" id="cadastro-senha" name="senha"
                            autocomplete="new-password" required>
                    </fieldset>
                    <button type="submit" class="loginBt">Cadastrar</button>
                    <button type="button" class="loginBt" data-alvo="login">Já tenho conta</button>
                </form>
            </section>
        </div>
    </main>
    <footer class="rodape">Copyright 2026 ®</footer>
    <script type="module" src="paginas/login.js"></script>
</body>
</html>
