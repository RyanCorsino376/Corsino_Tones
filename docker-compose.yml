# Development database only (stage 07). First copy .env.example to .env and choose a password.
# Host port 5433, not 5432, so it does not clash with a local PostgreSQL. The API reads the
# same password from CORSINO_DB_PASSWORD.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: corsinotones
      POSTGRES_USER: corsino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
